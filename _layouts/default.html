<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>{{ page.title }}</title>
  <meta content="{{ page.description }}" name="description" />
  <meta content="{{ page.author }}" name="author" />
  <meta content="{{ page.keywords }}" name="keywords" />
  <meta content="#282828" name="theme-color" />
  <meta content="{{ page.title }}" property="og:title" />
  <meta content="{{ page.og_description | default: page.description }}" property="og:description" />
  <meta content="https://avatars.githubusercontent.com/u/77088155" property="og:image" />
  <meta content="{{ site.url }}{{ page.url }}" property="og:url" />
  <meta content="website" property="og:type" />
  <meta content="summary" name="twitter:card" />
  <meta content="{{ page.title }}" name="twitter:title" />
  <meta content="{{ page.og_description | default: page.description }}" name="twitter:description" />
  <meta content="https://avatars.githubusercontent.com/u/77088155" name="twitter:image" />
  <meta content="@syswraith" name="twitter:creator" />
  <link href="{{ '/favicon.ico' | relative_url }}" rel="icon" type="image/x-icon" />
  <link href="{{ '/style.css' | relative_url }}" rel="stylesheet" />
</head>
<body>
  <button class="theme-toggle" id="toggleTheme">🌚</button>
  <div class="container{% if page.container_class %} {{ page.container_class }}{% endif %}">
    {{ content }}
  </div>
  <script>
    const btn = document.getElementById("toggleTheme");
    if (localStorage.getItem("theme") === "light" ||
      (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: light)").matches)) {
      document.documentElement.classList.add("light");
      btn.textContent = "🌚";
    } else {
      document.documentElement.classList.remove("light");
      btn.textContent = "🌝";
    }
    btn.addEventListener("click", () => {
      document.documentElement.classList.toggle("light");
      const isLight = document.documentElement.classList.contains("light");
      btn.textContent = isLight ? "🌚" : "🌝";
      localStorage.setItem("theme", isLight ? "light" : "dark");
    });
  </script>
</body>
</html>
