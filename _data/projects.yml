- name: CHIP-8
  url: https://github.com/syswraith/chip8
  meta: "Emulator / Virtual machine • C"
  description: "A CHIP-8 emulator using Raylib, with a full fetch-decode-execute cycle, custom opcode table, and display/keypad handling. Validated against ROMs like Breakout, Tetris, and Maze — extended with a nonstandard opcode that streams pre-processed 1-bit video into the display buffer for full-motion playback."
- name: Jorth
  url: https://github.com/syswraith/jorth
  meta: "Forth interpreter • JavaScript"
  description: "A stack-based Forth interpreter written in JavaScript, compiled with QuickJS into a single native binary. Supports word definitions, loops, conditionals, variables, and raw keyboard input, with no runtime dependency. Check out [https://syswraith.com/jorth/](https://syswraith.com/jorth/)."
- name: Heimdall
  url: https://github.com/syswraith/heimdall
  meta: "Username enumerator (OSINT) • Go"
  description: "A single-binary tool that hunts down a username's footprint across the web- fast and concurrent by design. It checks presence via raw HTTP, JSON APIs, OpenGraph parsing, and headless/headed browser automation, skipping the need for hand-rolled parsing per site. Results are cached in SQLite, with configs fully YAML-driven for easy extension."
- name: Decompyler
  url: https://github.com/syswraith/decompyler
  meta: "PyInstaller decompiler/disassembler • Python"
  description: "Extracts PyInstaller-packed EXE and ELF binaries, lists their embedded .pyc modules, and disassembles or decompiles them side by side with pycdas and pycdc. Includes syntax-highlighted source editing, stdlib module hiding, and configurable paths for the pycdc and pycdas binaries."
- name: Scoundrel
  url: https://github.com/syswraith/scoundrel
  meta: "Terminal roguelike card game • C++"
  description: "A terminal implementation of Zach Gage & Kurt Bieg's 2011 card game *Scoundrel*, built with FTXUI. Rooms of 4 cards are dealt from a standard 52-card deck—fight monsters (♠ ♣), equip weapons (♦) to reduce damage, and heal with potions (♥). Survive without reaching 0 HP; clear rooms until the deck runs out to win."
- name: Gruvboxify
  url: https://github.com/syswraith/gruvboxify
  meta: "Image converter • Python"
  description: "Converts batches of PNG, JPEG, WebP, GIF, BMP, and TIFF images to the Gruvbox palette with drag-and-drop file selection and per-file conversion progress. Offers three palettes, EXIF orientation handling, transparency preservation, and NumPy-accelerated matching, with output saved to a persistent folder."
- name: Ryukendo
  url: https://github.com/syswraith/ryukendo
  meta: "Wordlist generator • Python"
  description: "A wordlist generator that leverages social connections to produce candidate passwords. Uses cartesian products, permutations & combinations and probability distributions to generate, sort and rank possible passwords."
- name: Ngzl
  url: https://github.com/syswraith/ngzl
  meta: "IRC C2 prototype • Python"
  description: "A prototype botnet script using the IRC protocol as command-and-control. Implements a client–server model with custom sockets for receiving shell commands and relaying output through an IRC server."
- name: Logo Interpreter
  url: https://github.com/syswraith/logo
  meta: "Interpreter • TypeScript"
  description: "A minimalistic Microsoft Logo interpreter featuring a custom tokenizer, recursive parser, AST generator, and an HTML5 Canvas drawing engine with angle-based turtle movement."
- name: Wintermute
  url: https://github.com/syswraith/wintermute
  meta: "URL shortener • TypeScript + Go"
  description: "A service for creating and retrieving shortened URLs with authentication and expiration capabilities. Users can generate compact aliases for long URLs, retrieve the originals via lookup, and manage access through JWT-based authentication with configurable expiry policies."
- name: Moodle Scraper
  url: https://github.com/syswraith/moodle-scraper
  meta: "Web scraper • Python"
  description: "A proof-of-concept data extraction tool for retrieving public profile details from a private Moodle instance. Handles login token authentication and stores the extracted data in a local SQLite database."
- name: Drunken Bishop
  url: https://github.com/syswraith/c-projects/
  meta: "Key visualizer • C"
  description: "An implementation of the Drunken Bishop algorithm used by OpenSSH to generate ASCII art representations of cryptographic keys."
- name: AML Shield
  url: https://github.com/Tervicke/bytecamp-26
  meta: "Monitoring platform • JavaScript/TypeScript"
  description: "A real-time transaction monitoring platform that uses network analysis and interactive dashboards to detect suspicious financial activity. Built for the 24-hour bytecamp-26 hackathon."
- name: IdentityShield
  url: https://github.com/syswraith/vortexa-26
  meta: "Auth risk assessment platform • TypeScript"
  description: "A full-stack authentication and risk assessment platform that evaluates login behavior using browser fingerprints, IP geolocation, and Supabase-backed session tracking. Combines React frontend, Express backend, and database migrations for auth-risk workflows. Built for the vortexa-26 hackathon."
- name: Orion
  url: https://github.com/Tervicke/devcraft-orion
  meta: "Auction system • TypeScript + Go"
  description: "A distributed auction system featuring Go backend services for concurrent bidding and state management, a TypeScript frontend for the reactive UI, and Python utilities for data processing pipelines. Built for the 48-hour devcraft '26 hackathon."
- name: WhatsApp Chat Summariser
  url: https://github.com/syswraith/wa-chat-summariser
  meta: "Chat summarisation pipeline • Node.js"
  description: "A chat summary service that pulls messages, sends them to a local LLM, and returns notifications via a publish–subscribe system. Built using Axios, whatsapp-web.js, NTFY, Ollama, and Deepseek-r1:7b."
- name: Hashing Implementations
  url: https://github.com/syswraith/c-projects
  meta: "Data structures • C"
  description: "Implementations of basic hashing concepts and collision resolution techniques, including chaining using linked lists, linear probing, and quadratic probing, in memory-safe C."
- name: Bus Reservation System
  url: https://github.com/syswraith/c-projects
  meta: "Terminal application • C"
  description: "A terminal-based bus reservation system written in C, featuring interactive seat selection and formatted CLI layouts."
- name: Dots and Boxes
  url: https://github.com/syswraith/python-projects
  meta: "Terminal game • Python"
  description: "A command-line implementation of the classic Dots and Boxes board game, focusing on custom grid and connection logic."
- name: Tic Tac Toe
  url: https://github.com/syswraith/c-projects
  meta: "Terminal game • C"
  description: "A command-line Tic Tac Toe game written in C, featuring a board state managed using a flattened 2D array."
